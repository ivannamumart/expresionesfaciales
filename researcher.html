<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel · Observatorio Sin Remedio</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    body { overflow-y: auto; }
  </style>
</head>
<body>

  <main class="researcher">

    <section id="login" class="r-login">
      <h1>Panel de investigación</h1>
      <p class="sub">Acceso reservado para la autora del estudio.</p>

      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" autocomplete="username" placeholder="il.munoz@uniandes.edu.co">
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password">
      </div>

      <button id="btn-login" class="btn-primary">Entrar</button>
      <div id="login-error" class="r-error" hidden></div>

      <a href="index.html" class="r-link">← Volver al observatorio</a>
    </section>

    <section id="dashboard" class="r-shell" hidden>

      <header class="r-head">
        <div>
          <h1>Panel de investigación</h1>
          <div class="sub">Observatorio Sin Remedio</div>
        </div>
        <div class="r-actions">
          <button id="btn-export" class="btn-ghost">Exportar CSV</button>
          <button id="btn-logout" class="btn-ghost">Salir</button>
        </div>
      </header>

      <section id="stats" class="r-overview"></section>

      <section class="r-chart">
        <div class="r-section-head">
          <h2>Pico medio por fragmento</h2>
          <div class="hint">de todas las sesiones</div>
        </div>
        <canvas id="chart-canvas"></canvas>
      </section>

      <section>
        <div class="r-section-head">
          <h2>Sesiones recientes</h2>
          <div class="hint">últimas 50</div>
        </div>
        <table id="sessions-table" class="r-table">
          <thead>
            <tr>
              <th>fecha</th>
              <th>sesión</th>
              <th>frags</th>
              <th>tiempo total</th>
              <th>pico risa</th>
              <th>dispositivo</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script type="module" src="js/researcher.js"></script>

</body>
</html>
